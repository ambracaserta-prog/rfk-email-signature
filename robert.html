<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RFK CFO Group Email Signature</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff;">
  <!-- Main Container Table -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="480" style="border-collapse: collapse; font-family: 'Segoe UI', Arial, sans-serif; background-color: #ffffff; width: 480px;">
    <tr>

      <!-- LEFT COLUMN: Dark Navy Banner with Gold Borders and Centered Logo -->
      <!-- Fixed size on the OUTER td (no padding here, since Outlook/Word adds padding
           on top of width/height instead of containing it). Padding is instead handled
           by a fixed-height nested table inside, so total rendered size stays exact. -->
      <td width="100" height="85" valign="top" align="center" style="width: 100px; height: 85px; background-color: #171E2E; border-top: 4px solid #C49A45; border-bottom: 4px solid #C49A45; mso-line-height-rule: exactly;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100" height="77" style="width: 100px; height: 77px;">
          <tr>
            <td width="100" height="77" align="center" valign="middle" style="width: 100px; height: 77px; mso-line-height-rule: exactly;">
              <img src="https://raw.githubusercontent.com/ambracaserta-prog/rfk-email-signature/main/logo%206.22%20(1).png" alt="RFK CFO Group" width="85" style="display: block; width: 85px; max-width: 85px; height: auto; border: 0;" />
            </td>
          </tr>
        </table>
      </td>

      <!-- RIGHT COLUMN: Contact Details -->
      <td valign="middle" height="85" style="padding: 10px 0 10px 22px; background-color: #ffffff; mso-line-height-rule: exactly;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; font-family: 'Segoe UI', Arial, sans-serif;">

          <!-- Name -->
          <tr>
            <td style="font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: bold; color: #171E2E; line-height: 24px; mso-line-height-rule: exactly; padding-bottom: 2px;">
              Robert F. Kleinman, CPA
            </td>
          </tr>

          <!-- Title -->
          <tr>
            <td style="font-size: 13px; font-weight: 700; color: #171E2E; line-height: 16px; mso-line-height-rule: exactly; padding-bottom: 14px;">
              Founder
            </td>
          </tr>
          <!-- Phone -->
          <tr>
            <td style="font-size: 12px; color: #4A5568; line-height: 20px; mso-line-height-rule: exactly; padding-bottom: 4px;">
              <span style="color: #C49A45; font-weight: 700;">Ph.:</span>
              <a href="tel:2014070522" style="color: #4A5568; text-decoration: none;">(201) 407 0522</a>
            </td>
          </tr>
          <!-- Email -->
          <tr>
            <td style="font-size: 12px; color: #4A5568; line-height: 20px; mso-line-height-rule: exactly; padding-bottom: 4px;">
              <span style="color: #C49A45; font-weight: 700;">E.:</span>
              <a href="mailto:robert@rfkcfogroup.com" style="color: #4A5568; text-decoration: none;">robert@rfkcfogroup.com</a>
            </td>
          </tr>
          <!-- Office -->
          <tr>
            <td style="font-size: 12px; color: #4A5568; line-height: 20px; mso-line-height-rule: exactly; padding-bottom: 4px;">
              <span style="color: #C49A45; font-weight: 700;">O.:</span>
              New York <span style="color: #C49A45;">|</span> Miami <span style="color: #C49A45;">|</span> Geneva <span style="color: #C49A45;">|</span> Cayman
            </td>
          </tr>
          <!-- Website -->
          <tr>
            <td style="font-size: 12px; color: #4A5568; line-height: 20px; mso-line-height-rule: exactly;">
              <span style="color: #C49A45; font-weight: 700;">W.:</span>
              <a href="https://rfkcfogroup.com" target="_blank" style="color: #4A5568; text-decoration: none;">rfkcfogroup.com</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
