<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RFK CFO Group Email Signature</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff;">

  <!-- Main Outer Container Table -->
  <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; font-family: Arial, sans-serif; background-color: #ffffff; width: 480px;">
    <tr>
      
      <!-- LEFT COLUMN: Dark Navy Banner with Logo -->
      <td width="150" valign="middle" align="center" style="width: 150px; background-color: #171E2E; padding: 20px 15px; border-bottom: 5px solid #C49A45;">
        <img src="https://raw.githubusercontent.com/ambracaserta-prog/rfk-email-signature/main/logo%206.22%20(1).png" alt="RFK CFO Group Logo" width="110" style="display: block; width: 110px; max-width: 110px; height: auto; border: 0;" />
      </td>

      <!-- RIGHT COLUMN: Contact Information -->
      <td valign="top" style="padding: 15px 0 15px 20px; background-color: #ffffff;">
        <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; font-family: Arial, sans-serif;">
          
          <!-- Name -->
          <tr>
            <td style="font-size: 18px; font-weight: bold; color: #171E2E; line-height: 22px; padding-bottom: 2px;">
              Robert F. Kleinman, CPA
            </td>
          </tr>
          
          <!-- Title -->
          <tr>
            <td style="font-size: 14px; font-weight: bold; color: #171E2E; line-height: 18px; padding-bottom: 15px;">
              Founder
            </td>
          </tr>

          <!-- Phone -->
          <tr>
            <td style="padding-bottom: 6px; font-size: 12px; color: #555555;">
              <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                <tr>
                  <td width="22" valign="middle" style="width: 22px;">
                    <img src="https://raw.githubusercontent.com/ambracaserta-prog/rfk-email-signature/main/Untitled%20(300%20x%20100%20px).png" alt="Phone" width="14" style="display: block; width: 14px; height: auto; border: 0;" />
                  </td>
                  <td valign="middle" style="font-size: 12px; color: #555555;">
                    <a href="tel:2014070522" style="color: #555555; text-decoration: none;">(201) 407 0522</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Email -->
          <tr>
            <td style="padding-bottom: 6px; font-size: 12px; color: #555555;">
              <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                <tr>
                  <td width="22" valign="middle" style="width: 22px;">
                    <img src="https://raw.githubusercontent.com/ambracaserta-prog/rfk-email-signature/main/mail.png" alt="Email" width="14" style="display: block; width: 14px; height: auto; border: 0;" />
                  </td>
                  <td valign="middle" style="font-size: 12px; color: #555555;">
                    <a href="mailto:robert@rfkcfogroup.com" style="color: #555555; text-decoration: none;">robert@rfkcfogroup.com</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Location -->
          <tr>
            <td style="padding-bottom: 6px; font-size: 12px; color: #555555;">
              <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                <tr>
                  <td width="22" valign="middle" style="width: 22px;">
                    <img src="https://raw.githubusercontent.com/ambracaserta-prog/rfk-email-signature/main/pin.png" alt="Location" width="14" style="display: block; width: 14px; height: auto; border: 0;" />
                  </td>
                  <td valign="middle" style="font-size: 12px; color: #555555;">
                    New York | Miami | Geneva | Cayman
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Website -->
          <tr>
            <td style="font-size: 12px; color: #555555;">
              <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                <tr>
                  <td width="22" valign="middle" style="width: 22px;">
                    <img src="https://raw.githubusercontent.com/ambracaserta-prog/rfk-email-signature/main/world.png" alt="Globe" width="14" style="display: block; width: 14px; height: auto; border: 0;" />
                  </td>
                  <td valign="middle" style="font-size: 12px; color: #555555;">
                    <a href="https://rfkcfogroup.com" target="_blank" style="color: #555555; text-decoration: none;">rfkcfogroup.com</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
