<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RFK CFO Group Email Signature</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff;">

  <!-- Main Container Table -->
  <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; background-color: #ffffff; width: 450px;">
    <tr>
      
      <!-- LEFT COLUMN: Navy Brand Banner -->
      <td width="140" valign="middle" align="center" style="width: 140px; background-color: #171E2E; padding: 20px 10px; border-bottom: 4px solid #C49A45; border-right: 1px solid #E2E8F0;">
        <img src="https://raw.githubusercontent.com/ambracaserta-prog/rfk-email-signature/main/logo%206.22%20(1).png" alt="RFK CFO Group Logo" width="105" style="display: block; width: 105px; max-width: 105px; height: auto; border: 0;" />
      </td>

      <!-- RIGHT COLUMN: Contact Info -->
      <td valign="top" style="padding: 14px 0 14px 20px; background-color: #ffffff;">
        <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; font-family: 'Segoe UI', Helvetica, Arial, sans-serif;">
          
          <!-- Name -->
          <tr>
            <td style="font-family: Georgia, 'Times New Roman', serif; font-size: 18px; font-weight: bold; color: #171E2E; line-height: 22px; padding-bottom: 2px;">
              Robert F. Kleinman, CPA
            </td>
          </tr>
          
          <!-- Title -->
          <tr>
            <td style="font-size: 11px; font-weight: 700; color: #C49A45; text-transform: uppercase; letter-spacing: 1.2px; line-height: 15px; padding-bottom: 12px;">
              Founder
            </td>
          </tr>

          <!-- Phone -->
          <tr>
            <td style="padding-bottom: 6px;">
              <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                <tr>
                  <td width="26" valign="middle" align="left" style="width: 26px;">
                    <img src="https://raw.githubusercontent.com/ambracaserta-prog/rfk-email-signature/main/Untitled%20(300%20x%20100%20px).png" alt="Phone" width="16" style="display: block; width: 16px; height: auto; border: 0;" />
                  </td>
                  <td valign="middle" style="font-size: 12px; color: #4A5568;">
                    <a href="tel:2014070522" style="color: #4A5568; text-decoration: none;">(201) 407 0522</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Email -->
          <tr>
            <td style="padding-bottom: 6px;">
              <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                <tr>
                  <td width="26" valign="middle" align="left" style="width: 26px;">
                    <img src="https://raw.githubusercontent.com/ambracaserta-prog/rfk-email-signature/main/mail.png" alt="Email" width="16" style="display: block; width: 16px; height: auto; border: 0;" />
                  </td>
                  <td valign="middle" style="font-size: 12px; color: #4A5568;">
                    <a href="mailto:robert@rfkcfogroup.com" style="color: #4A5568; text-decoration: none;">robert@rfkcfogroup.com</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Location -->
          <tr>
            <td style="padding-bottom: 6px;">
              <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                <tr>
                  <td width="26" valign="middle" align="left" style="width: 26px;">
                    <img src="https://raw.githubusercontent.com/ambracaserta-prog/rfk-email-signature/main/pin.png" alt="Location" width="16" style="display: block; width: 16px; height: auto; border: 0;" />
                  </td>
                  <td valign="middle" style="font-size: 12px; color: #4A5568;">
                    New York <span style="color: #C49A45; font-weight: bold;">|</span> Miami <span style="color: #C49A45; font-weight: bold;">|</span> Geneva <span style="color: #C49A45; font-weight: bold;">|</span> Cayman
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Website -->
          <tr>
            <td>
              <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                <tr>
                  <td width="26" valign="middle" align="left" style="width: 26px;">
                    <img src="https://raw.githubusercontent.com/ambracaserta-prog/rfk-email-signature/main/world.png" alt="Globe" width="16" style="display: block; width: 16px; height: auto; border: 0;" />
                  </td>
                  <td valign="middle" style="font-size: 12px; color: #4A5568;">
                    <a href="https://rfkcfogroup.com" target="_blank" style="color: #4A5568; text-decoration: none; font-weight: 600;">rfkcfogroup.com</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
